<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn overeflow</title>
    <style>
      p {
        height: 100px;
        width: 150px;
        font-size: 20px;
        background-color: aqua;
        overflow: scroll;           <!-- visible, hidden, scroll, auto  -- overflow: hidden; -->
      }
    </style>
  </head>
  <body>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Veritatis atque,
      possimus tenetur porro ullam odit numquam iusto quod, labore repudiandae
      nam error veniam eius, eum itaque ad in saepe quasi.
    </p>
  </body>
</html>
