<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css Position</title>
    <style>
      .one {
        height: 300px;
        width: 100pox;
        border: 2px rgb(66, 211, 206);
        background-color: bisque;
        /*  This is exlaplaction  on staytic and reletive pgition              */
        position: relative;
        top: 100px;
        left:500px;
      }
      .two {
        height: 300px;
        width: 1000px;
        border: 2px rgb(66, 211, 206);
        background-color: rgb(215, 24, 158);
        position: fixed;
        top: 100px;
        left:500px;
      }
      .three {
        height: 300px;
        width: 1000px;
        border: 2px rgb(66, 211, 206);
        background-color: rgb(180, 22, 22);
        position: sticky;
        top: 100px; 
      }
      .four {
        height: 300px;
        width: 100pox;
        border: 2px rgb(66, 211, 206);
        background-color: rgb(120, 116, 241);
      }
      .five {
        height: 300px;
        width: 100pox;
        border: 2px rgb(66, 211, 206);
        background-color: rgb(31, 8, 131);
      }
      .six {
         height: 300px;
            width:100pox;
            border: 2px rgb(66, 211, 206);
            background-color: rgb(23, 207, 79);
      }
    </style>
  </head>

  <body>
    <div class="one">one</div>
    <div class="two">two</div>
    <div class="three">three</div>
    <div class="four">four</div>
    <div class="five">five</div>
    <div class="six">six</div>
  </body>
</html>
